# Render Blueprint: New + > Blueprint, point it at this repo.
services:
  # ---------- Backend (Node / Express / Socket.IO) ----------
  - type: web
    name: reachpulse-finalrender
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://reachpulse-finalrender-1.onrender.com
      # Secrets: set these in the Render dashboard (never commit them).
      - key: MONGODB_URI
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v23.0
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: SHOPIFY_FLOW_SECRET
        sync: false

  # ---------- Frontend (Vite static site) ----------
  - type: web
    name: reachpulse-finalrender-1
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://reachpulse-finalrender.onrender.com
    routes:
      # SPA fallback so /dashboard, /inbox ... don't return 404 on refresh
      - type: rewrite
        source: /*
        destination: /index.html